name: Extract BlackBird Studio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/project
          unzip -q project.zip -d /tmp/project
          cp -a /tmp/project/Blackbird-studio-main/. .
          rm project.zip

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract BlackBird Studio project"
          git push
