[build]
  command = "npm run build"
  publish = "dist"

# Replace BACKEND_HOST with the actual Render service hostname after creating it.
# Keep these proxy rules above the SPA fallback so API and uploaded media reach Express.
[[redirects]]
  from = "/api/*"
  to = "https://BACKEND_HOST.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://BACKEND_HOST.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
