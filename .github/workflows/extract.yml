
name: Extract BlackBird Studio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p /tmp/project
          unzip -q "$ZIP_FILE" -d /tmp/project

          PROJECT_DIR=$(find /tmp/project -type f -name package.json -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json not found inside ZIP."
            exit 1
          fi

          echo "Project folder: $PROJECT_DIR"

          cp -a "$PROJECT_DIR/." .
          rm -f "$ZIP_FILE"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract BlackBird Studio project"
            git push
          else
            echo "No changes to commit."
          fi
