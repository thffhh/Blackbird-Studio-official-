services:
  - type: web
    name: blackbird-studio-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/public-data
    disk:
      name: blackbird-studio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data/data
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: ADMIN_EMAIL
        value: admin@blackbirdstudio.com
      - key: ADMIN_PASSWORD
        sync: false
